<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <img id="companyLogo" src="{{ url_for('static', filename='images/logoMedicalPartner.png') }}" alt="Company Logo">
        <h1>Equipment Service Management</h1>
    </header>
    <hr>
    <h2>Register</h2>
    <form method="post">
        Username: <input type="text" name="user_name" placeholder="Name"><br>
        Email: <input type="email" name="email" placeholder="YourName@company.com"><br>
        Password: <input type="password" name="password" placeholder="Password"><br>
        <input type="submit" value="Register">
    </form>

    <!-- Back button -->
    <form action="{{ url_for('home') }}">
        <button type="submit">Back to Home</button>
    </form>
</body>
</html>
