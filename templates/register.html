{% extends "base.html" %}

<!-- title passed to the base file so it can be shown in the browsers tab-->
{% block title %}Register{% endblock %}

{% block content %}
<h2>Register</h2>
<form id="registerForm" method="post">
    Username: <input type="text" name="user_name" placeholder="Name" required><br>
    Email: <input type="email" name="email" placeholder="YourName@company.com" required><br>
    Password: <input type="password" name="password" placeholder="Password" required><br>
    <button type="submit">Register</button>
</form>
{% endblock %}
